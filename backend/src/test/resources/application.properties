# ========================================================
# Test Configuration - Isolated In-Memory Schema
# ========================================================
spring.datasource.url=jdbc:h2:mem:slopeguard_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate in H2 MySQL-compatibility mode
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=12
spring.jpa.show-sql=false

# Flyway Database Migrations in Test
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

# Security & Secrets for testing
slopeguard.security.jwt.secret=slopeguard_test_secure_jwt_signing_key_minimum_32_bytes_2026_northeast
slopeguard.security.jwt.issuer=slopeguard-backend
slopeguard.security.jwt.expiration-seconds=900
slopeguard.upload.dir=./target/test-uploads
